<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="teleBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="teleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="teleGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>
  
  <!-- Outer Rounded Container -->
  <rect width="512" height="512" rx="112" fill="url(#teleBg)" />
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="url(#teleGlow)" stroke-width="6" stroke-opacity="0.5" />
  
  <!-- Telegram Paper Airplane Style Accent & Rupee Symbol -->
  <g transform="translate(256, 230) scale(1.1)">
    <!-- Shield / Glow Backdrop -->
    <circle cx="0" cy="0" r="140" fill="#6366f1" fill-opacity="0.12" />
    
    <!-- Telegram Paper Plane Wing -->
    <path d="M-110,30 L120,-90 L-40,80 L-50,130 L-20,95 L40,60" fill="none" stroke="#38bdf8" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Bold Indian Rupee Symbol in Center -->
    <g transform="translate(-10, 10)">
      <!-- Top Bar 1 -->
      <line x1="-50" y1="-65" x2="60" y2="-65" stroke="#ffffff" stroke-width="18" stroke-linecap="round" />
      <!-- Top Bar 2 -->
      <line x1="-50" y1="-30" x2="40" y2="-30" stroke="#ffffff" stroke-width="18" stroke-linecap="round" />
      <!-- Curved Loop -->
      <path d="M-20,-65 C35,-65 35,-5 -20,-5" fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="round" />
      <!-- Stem -->
      <line x1="-20" y1="-65" x2="-20" y2="60" stroke="#ffffff" stroke-width="18" stroke-linecap="round" />
      <!-- Diagonal Leg -->
      <line x1="-15" y1="-5" x2="55" y2="65" stroke="#10b981" stroke-width="18" stroke-linecap="round" />
    </g>
  </g>
  
  <!-- Sparkles / AI node accents -->
  <circle cx="120" cy="140" r="10" fill="#38bdf8" />
  <circle cx="390" cy="130" r="8" fill="#a855f7" />
  <circle cx="380" cy="380" r="12" fill="#10b981" />
  <circle cx="130" cy="390" r="9" fill="#f59e0b" />
</svg>
